[package]
name = "agent"
description = "The AI tool layer: tool contract, strict argument schemas, tier-gated registry and the executor that stands between a model and the server (ADR 0020)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
actions = { path = "../actions" }
ai = { path = "../ai" }
core-domain = { path = "../core" }
db = { path = "../db" }
i18n = { path = "../i18n" }
inventory = { path = "../inventory" }
net = { path = "../net" }
parity = { path = "../parity" }
plan = { path = "../plan" }
vault = { path = "../vault" }
# JSON is the wire format of tool calls. Default features off, `std` only (ADR 0005).
serde_json = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
# A single-threaded runtime to drive the async turn in tests.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
