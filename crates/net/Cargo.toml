[package]
name = "net"
description = "Hardened outbound HTTP(S), TCP and TLS-certificate client for the monitor and notifiers (ADR 0016)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# ring only: no aws-lc-rs (ADR 0016). `std` + `tls12` are the only other features we need.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "io-util"] }

[lints]
workspace = true
