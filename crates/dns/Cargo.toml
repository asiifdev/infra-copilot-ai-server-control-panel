[package]
name = "dns"
description = "DNS provider adapter trait, Cloudflare implementation, zone snapshots, and ownership checks (§12.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-domain = { path = "../core" }
net = { path = "../net" }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros"] }

[lints]
workspace = true
