[package]
name = "ai"
description = "OpenAI-compatible chat provider: function calling, Server-Sent Events streaming, retries and a circuit breaker (ADR 0020, M2-c)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
core-domain = { path = "../core" }
net = { path = "../net" }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Only the timer, for retry backoff (the net crate already pulls the runtime).
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "test-util", "net", "io-util"] }

[lints]
workspace = true
