name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: read-only by default; only the `publish` job gets `contents: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: infra
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: infra
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: infra
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: infra.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
      - name: Build web UI (embedded into infra binary)
        shell: bash
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p cli --target "${{ matrix.target }}"
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          pkg="nodivara-${tag}-${{ matrix.target }}"
          stage="dist/${pkg}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$stage/"
          cp README.md README.id.md LICENSE* "$stage/"
          mkdir -p artifacts
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -C dist -czf "artifacts/${pkg}.tar.gz" "${pkg}"
          else
            (cd dist && 7z a -tzip "../artifacts/${pkg}.zip" "${pkg}")
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-with-checksums
          path: release-assets/*
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
