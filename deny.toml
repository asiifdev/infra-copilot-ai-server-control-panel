# cargo-deny policy. Checked in CI (see .github/workflows/ci.yml).
# The project license is provisional (AGPL-3.0-only); re-check the allow list with a lawyer before release.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained/yanked crates fail the build.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licenses compatible with AGPL-3.0 distribution. Anything else fails until it is reviewed and added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are unpublished; do not check them against the allow list.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; crates.io wildcards stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
