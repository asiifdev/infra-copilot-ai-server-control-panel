<rect x="574" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#b6f205" stroke-width="2.5"/>
<circle cx="598" cy="126" r="13" fill="#b6f205"/><text x="598" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">5</text>
<text x="586" y="166" font-size="15" font-weight="700" fill="#eef1f8">Approve</text>
<text x="586" y="188" font-size="12.5" fill="#a9b3c7">you decide,</text>
<text x="586" y="205" font-size="12.5" fill="#a9b3c7">never auto</text>
<rect x="584" y="244" width="92" height="24" rx="12" fill="none" stroke="#a9b3c7" stroke-width="1.5" stroke-dasharray="4 3"/><text x="630" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#a9b3c7">PLANNED</text>
<path d="M689 183.0 l8 7 l-8 7" fill="none" stroke="#b6f205" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="704" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#262d44" stroke-width="1.5"/>
<circle cx="728" cy="126" r="13" fill="#b6f205"/><text x="728" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">6</text>
<text x="716" y="166" font-size="15" font-weight="700" fill="#eef1f8">Execute</text>
<text x="716" y="188" font-size="12.5" fill="#a9b3c7">closed list</text>
<text x="716" y="205" font-size="12.5" fill="#a9b3c7">of actions</text>
<rect x="714" y="244" width="92" height="24" rx="12" fill="none" stroke="#a9b3c7" stroke-width="1.5" stroke-dasharray="4 3"/><text x="760" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#a9b3c7">PLANNED</text>
<path d="M819 183.0 l8 7 l-8 7" fill="none" stroke="#b6f205" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="834" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#262d44" stroke-width="1.5"/>
<circle cx="858" cy="126" r="13" fill="#b6f205"/><text x="858" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">7</text>
<text x="846" y="166" font-size="15" font-weight="700" fill="#eef1f8">Verify</text>
<text x="846" y="188" font-size="12.5" fill="#a9b3c7">check result</text>
<text x="846" y="205" font-size="12.5" fill="#a9b3c7">audit trail</text>
<rect x="844" y="244" width="92" height="24" rx="12" fill="none" stroke="#a9b3c7" stroke-width="1.5" stroke-dasharray="4 3"/><text x="890" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#a9b3c7">PLANNED</text>
<text x="54" y="304" font-size="13" fill="#a9b3c7">Human step outlined in lime. Status as of 2026-11-19: only the read-only inventory and parity check run today.</text>
</svg>
