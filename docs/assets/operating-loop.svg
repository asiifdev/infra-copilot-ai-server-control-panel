<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The Nodivara operating loop</title>
<desc id="d">Seven steps: connect, understand, diagnose, propose, approve, execute, verify. Understand is available now, connect and diagnose are being built, the rest are planned. Approve is the human step.</desc>
<rect x="1" y="1" width="998" height="328" rx="22" fill="#0d1020" stroke="#262d44" stroke-width="2"/>
<text x="54" y="52" font-size="22" font-weight="700" fill="#eef1f8">The Nodivara operating loop</text>
<text x="54" y="74" font-size="14" fill="#a9b3c7">Nothing changes on your server without a proposal you approve.</text>
<rect x="54" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#262d44" stroke-width="1.5"/>
<circle cx="78" cy="126" r="13" fill="#b6f205"/><text x="78" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">1</text>
<text x="66" y="166" font-size="15" font-weight="700" fill="#eef1f8">Connect</text>
<text x="66" y="188" font-size="12.5" fill="#a9b3c7">read-only</text>
<text x="66" y="205" font-size="12.5" fill="#a9b3c7">collectors</text>
<rect x="64" y="244" width="92" height="24" rx="12" fill="none" stroke="#f5b83d" stroke-width="1.5"/><text x="110" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#f5b83d">BUILDING</text>
<path d="M169 183.0 l8 7 l-8 7" fill="none" stroke="#b6f205" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="184" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#262d44" stroke-width="1.5"/>
<circle cx="208" cy="126" r="13" fill="#b6f205"/><text x="208" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">2</text>
<text x="196" y="166" font-size="15" font-weight="700" fill="#eef1f8">Understand</text>
<text x="196" y="188" font-size="12.5" fill="#a9b3c7">inventory +</text>
<text x="196" y="205" font-size="12.5" fill="#a9b3c7">parity check</text>
<rect x="194" y="244" width="92" height="24" rx="12" fill="#b6f205"/><text x="240" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#070812">NOW</text>
<path d="M299 183.0 l8 7 l-8 7" fill="none" stroke="#b6f205" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="314" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#262d44" stroke-width="1.5"/>
<circle cx="338" cy="126" r="13" fill="#b6f205"/><text x="338" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">3</text>
<text x="326" y="166" font-size="15" font-weight="700" fill="#eef1f8">Diagnose</text>
<text x="326" y="188" font-size="12.5" fill="#a9b3c7">logs, errors,</text>
<text x="326" y="205" font-size="12.5" fill="#a9b3c7">with evidence</text>
<rect x="324" y="244" width="92" height="24" rx="12" fill="none" stroke="#f5b83d" stroke-width="1.5"/><text x="370" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#f5b83d">BUILDING</text>
<path d="M429 183.0 l8 7 l-8 7" fill="none" stroke="#b6f205" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="444" y="98" width="112" height="184" rx="14" fill="#151a2c" stroke="#262d44" stroke-width="1.5"/>
<circle cx="468" cy="126" r="13" fill="#b6f205"/><text x="468" y="131" font-size="14" font-weight="800" text-anchor="middle" fill="#070812">4</text>
<text x="456" y="166" font-size="15" font-weight="700" fill="#eef1f8">Propose</text>
<text x="456" y="188" font-size="12.5" fill="#a9b3c7">action, risk,</text>
<text x="456" y="205" font-size="12.5" fill="#a9b3c7">target, impact</text>
<rect x="454" y="244" width="92" height="24" rx="12" fill="none" stroke="#a9b3c7" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="260.5" font-size="12" font-weight="800" text-anchor="middle" fill="#a9b3c7">PLANNED</text>
